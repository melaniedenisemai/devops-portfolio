name: Portfolio Audit & Validation Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0' # Auditoría semanal los domingos a medianoche

jobs:
  audit-portfolio:
    name: Audit Monorepo & Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Prometheus Alert Rules
        run: |
          if [ -f prometheus-alerts-security.yml ]; then
            echo "=== Validando prometheus-alerts-security.yml ==="
            # Descargar y ejecutar promtool para verificación de sintaxis en CI
            wget https://github.com/prometheus/prometheus/releases/download/v2.45.0/prometheus-2.45.0.linux-amd64.tar.gz -O /tmp/prom.tar.gz
            tar -xzf /tmp/prom.tar.gz -C /tmp/
            /tmp/prometheus-2.45.0.linux-amd64/promtool check rules prometheus-alerts-security.yml
          else
            echo "prometheus-alerts-security.yml no encontrado"
          fi

      - name: Check Essential Monorepo Files
        run: |
          echo "=== Verificando estructura técnica del Monorepo ==="
          test -f README.md && echo "README.md OK" || exit 1
          test -f scripts/generar-alertas-seguridad.sh && echo "script de alertas OK" || exit 1
