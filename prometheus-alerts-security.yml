groups:
  - name: AlertasSeguridad
    rules:
      - alert: IngressPicoErrores4xx5xx
        expr: sum(rate(app_requests_total{status=~"4..|5.."}[2m])) > 5
        for: 10s
        labels:
          severity: critical
          category: ciberseguridad
        annotations:
          summary: "Pico anómalo de errores HTTP 4xx/5xx en Ingress/API"
          description: "Se detectaron más de 5 errores por segundo en los últimos 2 minutos."

      - alert: PodReiniciosFrecuentesSeguridad
        expr: increase(kube_pod_container_status_restarts_total{namespace="devops-portfolio"}[5m]) > 2
        for: 1m
        labels:
          severity: warning
          category: infraestructura
        annotations:
          summary: "Pod reiniciándose frecuentemente"
          description: "Posible fallo recurrente o intento de explotación."

      - alert: InvasionIntentosAuthFallidos
        expr: sum(rate(app_requests_total{status=~"401|404", endpoint="/login"}[2m])) > 5
        for: 10s
        labels:
          severity: critical
          category: aplicacion
        annotations:
          summary: "Posible ataque de fuerza bruta en autenticación"
          description: "Más de 5 intentos fallidos de login por segundo."

      - alert: PicoErroresConexionBaseDatos
        expr: sum(rate(app_db_errors_total[2m])) > 2
        for: 30s
        labels:
          severity: critical
          category: persistencia
        annotations:
          summary: "Pico de errores de conexión o consultas a la base de datos"
          description: "Posible falla de DB o inyección SQL."
